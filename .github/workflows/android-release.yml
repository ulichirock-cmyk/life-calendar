name: Android Release

# Builds a signed release APK and publishes it to GitHub Releases — the source the in-app updater
# (app/src/main/java/com/leida/lifecalendar/data/update/) reads.
#
# Triggers:
#   - pushing a version tag (v*)    -> creates/updates the Release for that tag with the APK attached
#   - manual "Run workflow" on main -> reads versionName from app/build.gradle.kts, creates that
#                                      v<versionName> tag and publishes the Release with the APK
#                                      (turn publish_release off to only get the run artifact)
#   - manual "Run workflow" on any other branch -> run artifact only, never a Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '在 main 上手动触发时建 v<versionName> tag 并发 Release（关掉则只出构件）'
        type: boolean
        default: true
      release_notes:
        description: '这版改了什么（一两行中文，会显示在 App 的更新弹窗里；留空则只有自动生成的条目）'
        type: string
        required: false
        default: ''

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-calendar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # Manual release path. The single source of truth for the version is app/build.gradle.kts —
      # the tag is derived from it rather than typed in, so the tag can never disagree with the
      # BuildConfig.VERSION_NAME inside the APK (the in-app updater compares exactly those two).
      - name: Resolve version tag (manual run on main)
        id: version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
        run: |
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$name" ]; then
            echo "::error::读不到 versionName（app/build.gradle.kts）"
            exit 1
          fi
          tag="v$name"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag 已经发过了——发新版前先在 app/build.gradle.kts 里提 versionName 与 versionCode"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "将发布 $tag（commit ${GITHUB_SHA}）" >> "$GITHUB_STEP_SUMMARY"

      # release_notes 排在自动生成的 "What's Changed" 之上 —— App 的更新弹窗只显示这一段
      # （见 ui/UpdateDialog.kt 的 highlights()），网页上的完整条目与链接照旧保留。
      - name: Publish GitHub Release (manual run on main)
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.release_notes }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
